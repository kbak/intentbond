name: Package and property checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  package-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTENTBOND_OFT_JAR: ${{ github.workspace }}/.tools/openfasttrace-4.9.0.jar
      INTENTBOND_ALLOY_JAR: ${{ github.workspace }}/.tools/alloy-6.2.0.jar
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.16', '3.12.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - name: Build wheel through sdist and install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.txt
          python -m build --no-isolation
          python -m pip install --no-index --no-deps dist/*.whl
          python -m pip check
          ib install-oft --destination "$GITHUB_WORKSPACE/.tools"
          ib install-alloy --destination "$GITHUB_WORKSPACE/.tools"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/source"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test installed wheel using tests and fixtures from sdist
        working-directory: ${{ runner.temp }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -c 'from importlib.resources import files; p = files("intentbond") / "skills/property-testing"; assert (p / "SKILL.md").is_file(); assert all((p / "references" / (n + ".md")).is_file() for n in ("python", "typescript", "haskell", "hegel"))'
          python -m pytest -p hypothesispytest -p intentbond.pytest_junit "$RUNNER_TEMP/source/tests" --junitxml="$RUNNER_TEMP/tests.xml" -q
          python -c 'import sys; from pathlib import Path; from intentbond.testing import junit_counts; junit_counts(Path(sys.argv[1]))' "$RUNNER_TEMP/tests.xml"
      - name: Qualify the opt-in async lifecycle example offline
        working-directory: ${{ runner.temp }}
        run: python -B "$RUNNER_TEMP/source/examples/async-lifecycle/demo.py" --out "$RUNNER_TEMP/async-lifecycle"
      - name: Qualify the opt-in CLI ordering example offline
        working-directory: ${{ runner.temp }}
        run: python -B "$RUNNER_TEMP/source/examples/cli-ordering/demo.py" --out "$RUNNER_TEMP/cli-ordering"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: package-and-tests-${{ matrix.python }}
          path: |
            dist/
            ${{ runner.temp }}/tests.xml
            ${{ runner.temp }}/async-lifecycle/
            ${{ runner.temp }}/cli-ordering/

  property-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTENTBOND_OFT_JAR: ${{ github.workspace }}/.tools/openfasttrace-4.9.0.jar
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, haskell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.language == 'typescript'
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Provision QuickCheck on the disposable runner
        if: matrix.language == 'haskell'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ghc libghc-quickcheck2-dev
          # Hosted runners may put a separate GHCup compiler ahead of /usr/bin.
          # Pair runghc with the compiler whose package DB apt provisioned.
          command -v runghc
          runghc --version
          /usr/bin/ghc --version
          /usr/bin/ghc-pkg list QuickCheck
          mkdir "$RUNNER_TEMP/haskell-bin"
          cat > "$RUNNER_TEMP/haskell-bin/runghc" <<'SH'
          #!/bin/sh
          exec /usr/bin/runghc -f /usr/bin/ghc "$@"
          SH
          chmod +x "$RUNNER_TEMP/haskell-bin/runghc"
          echo "$RUNNER_TEMP/haskell-bin" >> "$GITHUB_PATH"
          printf 'import Test.QuickCheck\nmain = quickCheck (\\x -> (x :: Int) == x)\n' > "$RUNNER_TEMP/quickcheck-preflight.hs"
          "$RUNNER_TEMP/haskell-bin/runghc" "$RUNNER_TEMP/quickcheck-preflight.hs"
      - name: Build and install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.txt
          python -m build --no-isolation
          python -m pip install --no-index --no-deps dist/*.whl
          if [ '${{ matrix.language }}' = python ]; then
            python -m pip install --require-hashes --only-binary=:all: -r examples/property-testing/python/requirements.txt
          fi
          ib install-oft --destination "$GITHUB_WORKSPACE/.tools"
          mkdir "$RUNNER_TEMP/source"
          tar -xzf dist/*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/source"
      - name: Check passing, failing and restored examples from sdist
        working-directory: ${{ runner.temp }}
        run: python "$RUNNER_TEMP/source/scripts/check_property_examples.py" '${{ matrix.language }}' --out "$RUNNER_TEMP/example-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: property-example-${{ matrix.language }}
          path: ${{ runner.temp }}/example-results/
