[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intentbond"
version = "0.5.0"
description = "Check requirement links and tests, compare Git versions, and save source-linked results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["requirements", "traceability", "verification", "openfasttrace", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = ["junitparser>=5.0.3,<6"]

[project.urls]
Documentation = "https://github.com/kbak/intentbond/tree/main/docs"
Repository = "https://github.com/kbak/intentbond"
Issues = "https://github.com/kbak/intentbond/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
smt = ["z3-solver==5.1.0.0"]

[project.scripts]
ib = "intentbond.cli:main"

[tool.setuptools.packages.find]
include = ["intentbond*"]

[tool.setuptools.package-data]
intentbond = ["skills/*/SKILL.md", "skills/*/references/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
